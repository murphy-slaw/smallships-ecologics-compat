plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}
mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")

    config("${mod_id}.mixins.json")
    config("${mod_id}.forge.mixins.json")
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = false

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = [
                project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
        ]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven/"
    }
}

dependencies {
    compileOnly project(":common")
    implementation 'org.jetbrains:annotations:25.0.0'
    implementation group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.3"))
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.3"))
    modImplementation "maven.modrinth:ecologics:cUQnkGgj"
    modImplementation "maven.modrinth:small-ships:${small_ships_version}-forge-${minecraft_version}"
}

jar {
    finalizedBy('reobfJar')
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    ])
}
